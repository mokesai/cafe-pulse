name: Tests

on:
  push:
    branches:
      - staging
  pull_request:
    branches:
      - staging
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run unit tests
        run: npm run test:unit

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SKIP_MFA_FOR_TESTING: 'true'
      NEXT_PUBLIC_SKIP_MFA_FOR_TESTING: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run integration tests
        run: npm run test:integration

  edge-fn:
    name: Edge function tests (Deno)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          # v2.x to match the lockfile format (deno.lock version 5).
          # Pin to v2.x rather than a specific minor so we get patch updates
          # without surprise majors.
          deno-version: v2.x

      - name: Run Deno tests for invoice-pipeline
        working-directory: supabase/functions/invoice-pipeline
        run: deno test __tests__/ --allow-env --allow-net
